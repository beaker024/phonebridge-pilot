plugins { id 'com.android.application' }
android {
    namespace 'org.phonebridge.sandbox'
    compileSdk 36
    defaultConfig {
        applicationId 'org.phonebridge.sandbox'
        minSdk 34
        targetSdk 36
        versionCode 1
        versionName '0.1.0-pilot'
    }
    buildTypes { debug { debuggable false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
